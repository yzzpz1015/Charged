<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455A64"/>
    </marker>
  </defs>

  <style>
    .l0  { fill:#ECEFF1; stroke:#607D8B; stroke-width:1.6; }
    .l1  { fill:#E3F2FD; stroke:#1976D2; stroke-width:1.8; }
    .l2  { fill:#FFF3E0; stroke:#EF6C00; stroke-width:1.8; }
    .edge{ stroke:#455A64; stroke-width:1.8; fill:none; }
    .t   { fill:#263238; font-size:15px; font-weight:bold; }
    .s   { fill:#37474F; font-size:12px; }
    .m   { fill:#546E7A; font-size:11px; }
    .r2  { fill:#1976D2; font-size:15px; font-weight:bold; }
    .d   { fill:#C62828; font-size:12px; font-weight:bold; }
  </style>

  <!-- L0 -->
  <rect class="l0" x="30" y="330" width="240" height="105" rx="10"/>
  <text class="t" x="50" y="358">L0 · 零样本</text>
  <text class="s" x="50" y="380">Kairos 原生分位数头</text>
  <text class="m" x="50" y="398">未微调，取中位数</text>
  <text class="r2" x="50" y="422">R² = 0.6705</text>

  <!-- L1 -->
  <rect class="l1" x="400" y="180" width="290" height="130" rx="10"/>
  <text class="t" x="420" y="208">L1 · 冻结主干 + 点预测头</text>
  <text class="s" x="420" y="230">换头（分位数 → 点预测）</text>
  <text class="r2" x="420" y="254">R² = 0.7982</text>
  <text class="m" x="420" y="276">LoRA +0.003（边际）</text>
  <text class="m" x="420" y="293">LLM 语义 gate ≈ 0（冗余）</text>

  <!-- L2 -->
  <rect class="l2" x="750" y="60" width="230" height="130" rx="10"/>
  <text class="t" x="770" y="88">L2 · + 外部模态</text>
  <text class="s" x="770" y="110">三种模态分三路</text>
  <text class="s" x="770" y="128">逐层注入 decoder（Cross-Attn）</text>
  <text class="r2" x="770" y="152" fill="#EF6C00">R² 待按正确架构重测</text>

  <!-- arrows -->
  <line class="edge" x1="270" y1="350" x2="400" y2="240" marker-end="url(#arr3)"/>
  <text class="d" x="300" y="300">+0.128</text>
  <text class="m" x="292" y="315">（换头 = 主增量）</text>

  <line class="edge" x1="690" y1="210" x2="750" y2="130" marker-end="url(#arr3)"/>
  <text class="d" x="700" y="178">外部模态</text>
  <text class="m" x="700" y="193">（净贡献待证）</text>

  <!-- note -->
  <text class="m" x="30" y="465" fill="#546E7A">逻辑闭环：换头证明主干强 → LoRA/LLM 语义证明内部已饱和 → 剩余增量只能来自外部模态（L2 的全部科学问题）。</text>
</svg>
