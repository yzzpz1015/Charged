<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455A64"/>
    </marker>
  </defs>

  <style>
    .frozen { fill:#ECEFF1; stroke:#607D8B; stroke-width:1.4; }
    .train  { fill:#E3F2FD; stroke:#1976D2; stroke-width:1.4; }
    .ext    { fill:#E8F5E9; stroke:#2E7D32; stroke-width:1.4; }
    .out    { fill:#FFF3E0; stroke:#EF6C00; stroke-width:1.4; }
    .base   { fill:#F3E5F5; stroke:#7B1FA2; stroke-width:1.6; }
    .lbl    { fill:#37474F; font-size:12px; }
    .lbl-b  { fill:#263238; font-size:13px; font-weight:bold; }
    .sub    { fill:#546E7A; font-size:10.5px; }
    .edge   { stroke:#455A64; stroke-width:1.4; fill:none; }
    .dash   { stroke:#90A4AE; stroke-width:1.2; fill:none; stroke-dasharray:5 4; }
  </style>

  <!-- ============ 三路模态来源（左列） ============ -->

  <!-- 路1：时序 -->
  <rect class="frozen" x="40" y="40" width="150" height="46" rx="8"/>
  <text class="lbl-b" x="115" y="59" text-anchor="middle">时序历史 x</text>
  <text class="sub" x="115" y="76" text-anchor="middle">ℝ&#185;&#215;72 · 单站点</text>

  <rect class="frozen" x="40" y="100" width="210" height="60" rx="8"/>
  <text class="lbl-b" x="145" y="124" text-anchor="middle">Kairos Encoder</text>
  <text class="sub" x="145" y="142" text-anchor="middle">冻结 · T5 · d_model=384</text>

  <rect class="base" x="40" y="180" width="210" height="48" rx="8"/>
  <text class="lbl-b" x="145" y="200" text-anchor="middle">时序隐状态</text>
  <text class="sub" x="145" y="218" text-anchor="middle">encoder states（KV）</text>

  <line class="edge" x1="115" y1="86" x2="115" y2="100" marker-end="url(#arrow)"/>
  <line class="edge" x1="145" y1="160" x2="145" y2="180" marker-end="url(#arrow)"/>

  <!-- 路2：POI -->
  <rect class="ext" x="40" y="330" width="170" height="44" rx="8"/>
  <text class="lbl-b" x="125" y="348" text-anchor="middle">POI 密度</text>
  <text class="sub" x="125" y="364" text-anchor="middle">ℝ&#185;&#215;96 = 32&#215;3</text>

  <rect class="train" x="40" y="388" width="170" height="40" rx="8"/>
  <text class="lbl" x="125" y="405" text-anchor="middle">proj_poi → tokens</text>
  <text class="sub" x="125" y="420" text-anchor="middle">Linear(96 → d)</text>
  <line class="edge" x1="125" y1="374" x2="125" y2="388" marker-end="url(#arrow)"/>

  <!-- 路3：卫星 -->
  <rect class="ext" x="40" y="500" width="170" height="44" rx="8"/>
  <text class="lbl-b" x="125" y="518" text-anchor="middle">卫星 patch tokens</text>
  <text class="sub" x="125" y="534" text-anchor="middle">DINOv2 patch · 每站点 N 个</text>

  <rect class="train" x="40" y="558" width="170" height="40" rx="8"/>
  <text class="lbl" x="125" y="575" text-anchor="middle">proj_sat → tokens</text>
  <text class="sub" x="125" y="590" text-anchor="middle">Linear(768 → d)</text>
  <line class="edge" x1="125" y1="544" x2="125" y2="558" marker-end="url(#arrow)"/>

  <!-- 三路 bus（逐层注入用的垂直母线） -->
  <line class="edge" x1="330" y1="204" x2="330" y2="620" stroke="#1976D2" stroke-width="2.0"/>
  <line class="edge" x1="305" y1="408" x2="305" y2="620" stroke="#2E7D32" stroke-width="2.0"/>
  <line class="edge" x1="280" y1="578" x2="280" y2="620" stroke="#EF6C00" stroke-width="2.0"/>

  <text class="sub" x="338" y="196" fill="#1976D2">时序</text>
  <text class="sub" x="314" y="400" fill="#2E7D32">POI</text>
  <text class="sub" x="252" y="570" fill="#EF6C00">卫星</text>

  <line class="edge" x1="250" y1="204" x2="330" y2="204" marker-end="url(#arrow)"/>
  <line class="edge" x1="210" y1="408" x2="305" y2="408" marker-end="url(#arrow)"/>
  <line class="edge" x1="210" y1="578" x2="280" y2="578" marker-end="url(#arrow)"/>

  <!-- ============ Kairos Decoder：4 层逐层注入 ============ -->
  <rect class="frozen" x="380" y="30" width="680" height="560" rx="10" fill="#F4F6F8"/>
  <text class="lbl-b" x="400" y="52">Kairos Decoder（冻结）· T5 · 4 层 T5Block</text>
  <text class="sub" x="400" y="68">每层：Self-Attn → Cross-Attn(时序 · POI · 卫星) → FFN，三路逐层注入</text>
  <text class="sub" x="400" y="82">（新增 POI/卫星 Cross-Attn + gate 可训练 · 主干冻结）</text>

  <!-- Layer 1..4 -->
  <rect class="train" x="420" y="90" width="600" height="86" rx="8"/>
  <text class="lbl-b" x="440" y="112">Layer 1</text>
  <text class="sub" x="440" y="130">Self-Attn → CA&#8321;(时序) · CA&#8322;(POI) · CA&#8323;(卫星) → FFN</text>
  <text class="sub" x="440" y="148">h = h_base + Σ gate_i·CrossAttn_i(h_base, aux_i)</text>

  <rect class="train" x="420" y="200" width="600" height="86" rx="8"/>
  <text class="lbl-b" x="440" y="222">Layer 2</text>
  <text class="sub" x="440" y="240">Self-Attn → CA&#8321; · CA&#8322; · CA&#8323; → FFN</text>
  <text class="sub" x="440" y="258">h = h_base + Σ gate_i·CrossAttn_i(h_base, aux_i)</text>

  <rect class="train" x="420" y="310" width="600" height="86" rx="8"/>
  <text class="lbl-b" x="440" y="332">Layer 3</text>
  <text class="sub" x="440" y="350">Self-Attn → CA&#8321; · CA&#8322; · CA&#8323; → FFN</text>
  <text class="sub" x="440" y="368">h = h_base + Σ gate_i·CrossAttn_i(h_base, aux_i)</text>

  <rect class="train" x="420" y="420" width="600" height="86" rx="8"/>
  <text class="lbl-b" x="440" y="442">Layer 4</text>
  <text class="sub" x="440" y="460">Self-Attn → CA&#8321; · CA&#8322; · CA&#8323; → FFN</text>
  <text class="sub" x="440" y="478">h = h_base + Σ gate_i·CrossAttn_i(h_base, aux_i)</text>

  <!-- 层间顺序箭头 -->
  <line class="edge" x1="720" y1="176" x2="720" y2="200" marker-end="url(#arrow)"/>
  <line class="edge" x1="720" y1="286" x2="720" y2="310" marker-end="url(#arrow)"/>
  <line class="edge" x1="720" y1="396" x2="720" y2="420" marker-end="url(#arrow)"/>

  <!-- 三路注入箭头：bus → 每层 -->
  <line class="edge" x1="330" y1="133" x2="420" y2="133" marker-end="url(#arrow)"/>
  <line class="edge" x1="305" y1="133" x2="420" y2="133" marker-end="url(#arrow)" stroke="#2E7D32"/>
  <line class="edge" x1="280" y1="133" x2="420" y2="133" marker-end="url(#arrow)" stroke="#EF6C00"/>

  <line class="edge" x1="330" y1="243" x2="420" y2="243" marker-end="url(#arrow)"/>
  <line class="edge" x1="305" y1="243" x2="420" y2="243" marker-end="url(#arrow)" stroke="#2E7D32"/>
  <line class="edge" x1="280" y1="243" x2="420" y2="243" marker-end="url(#arrow)" stroke="#EF6C00"/>

  <line class="edge" x1="330" y1="353" x2="420" y2="353" marker-end="url(#arrow)"/>
  <line class="edge" x1="305" y1="353" x2="420" y2="353" marker-end="url(#arrow)" stroke="#2E7D32"/>
  <line class="edge" x1="280" y1="353" x2="420" y2="353" marker-end="url(#arrow)" stroke="#EF6C00"/>

  <line class="edge" x1="330" y1="463" x2="420" y2="463" marker-end="url(#arrow)"/>
  <line class="edge" x1="305" y1="463" x2="420" y2="463" marker-end="url(#arrow)" stroke="#2E7D32"/>
  <line class="edge" x1="280" y1="463" x2="420" y2="463" marker-end="url(#arrow)" stroke="#EF6C00"/>

  <!-- ============ 输出：head + 反归一化 ============ -->
  <line class="edge" x1="720" y1="506" x2="720" y2="620" marker-end="url(#arrow)"/>

  <rect class="base" x="430" y="620" width="580" height="44" rx="8"/>
  <text class="lbl-b" x="720" y="639" text-anchor="middle">h_final = decoder 末层隐状态  [B&#215;384]</text>
  <text class="sub" x="720" y="656" text-anchor="middle">净贡献 = L2 R² − L1 R²（L1：无外部路径、单独训练 · 0.7957）</text>

  <rect class="train" x="500" y="700" width="440" height="48" rx="8"/>
  <text class="lbl-b" x="720" y="722" text-anchor="middle">ForecastHead（可训练）</text>
  <text class="sub" x="720" y="739" text-anchor="middle">LN → Linear(384→384) → GELU → Linear(384→pre_len)</text>

  <rect class="out" x="520" y="776" width="400" height="46" rx="8"/>
  <text class="lbl-b" x="720" y="796" text-anchor="middle">&#375; [B&#215;pre_len]  &#8594;  反归一化 &#183;scale + loc  &#8594;  R&#178;</text>
  <text class="sub" x="720" y="813" text-anchor="middle">全零历史窗口已剔除（&#8594; [数据零值分析.md]）</text>

  <line class="edge" x1="720" y1="664" x2="720" y2="700" marker-end="url(#arrow)"/>
  <line class="edge" x1="720" y1="748" x2="720" y2="776" marker-end="url(#arrow)"/>

  <!-- ============ 注入公式 ============ -->
  <rect x="40" y="640" width="330" height="92" rx="8" fill="#F5F5F5" stroke="#9E9E9E"/>
  <text class="lbl-b" x="60" y="664">逐层注入公式（每层）</text>
  <text class="lbl" x="60" y="686">h = h_base + Σ gate_i·CrossAttn_i(h_base, aux_i)</text>
  <text class="sub" x="60" y="705">gate_i 标量 · 初始 0（可证伪）</text>
  <text class="sub" x="60" y="722">CrossAttn_i：Q = h_base，KV = 模态 i tokens</text>

  <!-- 图例（右侧下方） -->
  <rect x="40" y="744" width="320" height="96" rx="8" fill="#FAFAFA" stroke="#B0BEC5"/>
  <text class="lbl-b" x="60" y="764">图例</text>
  <rect class="frozen" x="60" y="774" width="18" height="12" rx="3"/><text class="lbl" x="86" y="785">冻结（Kairos 主干）</text>
  <rect class="train" x="60" y="794" width="18" height="12" rx="3"/><text class="lbl" x="86" y="805">可训练（投影 / head）</text>
  <rect class="ext" x="180" y="774" width="18" height="12" rx="3"/><text class="lbl" x="206" y="785">外部模态（静态）</text>
  <rect class="base" x="180" y="794" width="18" height="12" rx="3"/><text class="lbl" x="206" y="805">隐状态 / 输出</text>
</svg>
